<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea tu personaje</title>
<style>
  :root{
    --bg:#fdf1f4; --ink:#3a2c3a; --muted:#8a7585; --accent:#e86f9a; --accent-ink:#fff;
    --card:#ffffff; --line:#f0d5df; --soft:#fbe4ec; --violet:#7a63d9;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--ink);
    background: radial-gradient(1200px 500px at 50% -10%, #ffe3ec 0%, var(--bg) 60%);
    min-height:100vh;
  }
  .app{max-width:720px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:18px}
  header{text-align:center}
  h1{margin:0;font-size:clamp(26px,5vw,34px);letter-spacing:.2px}
  header p{margin:6px 0 0;color:var(--muted);font-size:15px}

  .stage{
    width:100%;display:flex;justify-content:center;align-items:center;
    background-color:var(--card);
    background-image:radial-gradient(#f7dde7 1.3px, transparent 1.3px);
    background-size:18px 18px;
    border:2px solid var(--line);border-radius:28px;padding:16px;
    box-shadow:0 10px 30px rgba(232,111,154,.14);
  }
  /* El lienzo conserva su tamaño nativo (296x488); solo se escala al mostrarlo.
     El leve desplazamiento alinea el eje del cuerpo con el centro de la pantalla. */
  #view{
    display:block;height:clamp(320px,56vh,520px);width:auto;aspect-ratio:296/488;
    transform:translateX(-1.7%);
  }

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
  @media (max-width:520px){.actions{grid-template-columns:repeat(2,1fr)}}
  .btn{
    appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:18px;padding:14px 8px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  }
  .btn .ico{font-size:24px;line-height:1}
  .btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 16px rgba(232,111,154,.2)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible,.tab:focus-visible,.opt:focus-visible,.item:focus-visible,.close:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:#d95b89}

  .colors{width:100%;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
  .colors h2{margin:0 0 4px;font-size:18px}
  .colors .hint{margin:0 0 12px;color:var(--muted);font-size:13px}
  .color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:14px;padding:8px 10px;font-size:14px;font-weight:600}
  .crow.all{grid-column:1/-1;background:#efeaff}
  input[type=color]{
    -webkit-appearance:none;appearance:none;width:34px;height:34px;border:2px solid #fff;border-radius:50%;padding:0;cursor:pointer;
    background:none;box-shadow:0 0 0 2px var(--line);flex:none;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
  input[type=color]::-moz-color-swatch{border:none;border-radius:50%}

  /* Panel de pestañas */
  .overlay{position:fixed;inset:0;background:rgba(58,44,58,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.open{display:flex}
  .panel{
    background:var(--card);width:100%;max-width:560px;max-height:86vh;border-radius:26px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  @media (max-width:520px){
    .overlay{align-items:flex-end;padding:0}
    .panel{border-radius:26px 26px 0 0;max-height:88vh}
  }
  .panel-head{display:flex;align-items:center;gap:6px;padding:12px 12px 0 12px}
  .tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
  .tab{
    appearance:none;border:none;background:transparent;font:inherit;font-weight:700;font-size:15px;color:var(--muted);
    padding:10px 14px;border-radius:14px 14px 0 0;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;
  }
  .tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);background:var(--soft)}
  .close{appearance:none;border:none;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
  .panel-body{padding:18px;overflow:auto;border-top:2px solid var(--line)}
  .panel-body h3{margin:0 0 4px;font-size:20px}
  .panel-body .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .item{
    appearance:none;font:inherit;text-align:center;background:var(--soft);border:2px solid transparent;border-radius:18px;
    padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);
  }
  button.item{cursor:pointer}
  button.item:hover{border-color:var(--accent)}
  .item.on{border-color:var(--accent);background:#fff0f5}
  .thumb{width:100%;height:76px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;border:1px solid var(--line)}
  .thumb canvas{max-width:90%;max-height:62px;width:auto;height:auto}
  .item .name{font-weight:700;font-size:15px}
  .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#fff;color:var(--muted);border:1px solid var(--line)}
  .tag.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tag.have{background:#e6f6ea;color:#2f7a45;border-color:#bfe5c9}

  .redeem{display:flex;gap:8px;flex-wrap:wrap}
  .redeem input[type=text]{
    flex:1;min-width:180px;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);
    letter-spacing:2px;text-transform:uppercase;
  }
  .redeem input[type=text]:focus{outline:none;border-color:var(--accent)}
  .redeem button{
    appearance:none;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:12px 20px;border-radius:14px;cursor:pointer
  }
  .msg{margin-top:12px;min-height:22px;color:var(--muted);font-size:14px}

  .opts{display:grid;gap:12px}
  .opt{
    appearance:none;font:inherit;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:18px;padding:16px;cursor:pointer;
    display:flex;gap:14px;align-items:center;color:var(--ink)
  }
  .opt:hover{border-color:var(--accent)}
  .opt .ico{font-size:30px}
  .opt b{display:block;font-size:16px}
  .opt span{color:var(--muted);font-size:13px}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  [hidden]{display:none !important}
  .group-title{margin:20px 0 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .panel-body .sub + .group-title{margin-top:6px}
  .thumb img,.thumb video{max-width:90%;max-height:76px;width:auto;height:auto;border-radius:6px}
  .thumb.locked{position:relative;background:#f7f2f5}
  .thumb.locked::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.25)}
  .item.locked .name{color:var(--muted);letter-spacing:3px}
  .item.locked{background:#f3ecf0}
  .msg.good{color:#2f7a45;font-weight:700}
  .msg.bad{color:#b4426a;font-weight:700}
  .mini{appearance:none;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;border-radius:12px;padding:6px 10px;cursor:pointer}
  .mini:hover{border-color:var(--accent)}
  .row-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  button.wide{appearance:none;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:14px;padding:12px 18px;width:100%;margin-top:12px;cursor:pointer}
  .viewer-media{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#f7f2f5;display:block}
  .check{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:700}
  .check input{width:18px;height:18px;accent-color:var(--accent)}
  .pill{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;font-weight:700;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .pill-name{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill button{appearance:none;border:none;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
  .vinyl{width:76px;height:76px;border-radius:50%;position:relative;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25);
    background:repeating-radial-gradient(circle,#1b1520 0 2px,#2c2332 2px 3px)}
  .vinyl::before{content:'';position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 30deg,transparent 0 18%,rgba(255,255,255,.16) 25%,transparent 32% 68%,rgba(255,255,255,.12) 75%,transparent 82%)}
  .vinyl .label{position:absolute;inset:30%;border-radius:50%;background:var(--accent) center/cover no-repeat}
  .vinyl .label::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;inset:0;margin:auto;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .vinyl.spin{animation:vspin 3s linear infinite}
  @keyframes vspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.vinyl.spin{animation:none}}
  .emobar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
  .chip{appearance:none;border:2px solid var(--line);background:#fff;border-radius:999px;font-size:22px;line-height:1;width:46px;height:46px;cursor:pointer;transition:transform .12s,border-color .12s}
  .chip:hover{transform:translateY(-2px);border-color:var(--accent)}
  .chip.on{border-color:var(--accent);background:#fff0f5}
  .chip:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
  .thumb.emo{font-size:40px}
  .foot{margin-top:4px;font-size:12px}
  .foot a{color:var(--muted);opacity:.7;text-decoration:none;border-bottom:1px dotted var(--muted)}
  .foot a:hover,.foot a:focus-visible{opacity:1;color:var(--accent)}

</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Crea tu personaje</h1>
    <p>Elige colores, cámbiale la ropa y los rasgos, y descárgalo.</p>
  </header>

  <section class="stage" aria-label="Tu personaje">
    <canvas id="view" width="296" height="488" role="img" aria-label="Vista de tu personaje"></canvas>
  </section>

  <div class="emobar" id="emoBar" hidden aria-label="Emociones"></div>

  <nav class="actions" aria-label="Acciones">
    <button class="btn" id="btnWardrobe" type="button"><span class="ico">👚</span>Armario</button>
    <button class="btn" id="btnRedeem" type="button"><span class="ico">🔑</span>Canjear</button>
    <button class="btn" id="btnCatalog" type="button"><span class="ico">📖</span>Catálogo</button>
    <button class="btn primary" id="btnDownload" type="button"><span class="ico">⬇️</span>Descargar</button>
  </nav>

  <section class="colors" aria-label="Colores">
    <h2>Colores</h2>
    <p class="hint">Todo lo que es blanco en las piezas se puede pintar.</p>
    <div class="color-grid" id="colorGrid"></div>
  </section>

  <footer class="foot"><a href="admin.html">Panel de admin</a></footer>
</main>

<!-- Pestañas: Armario / Canjear / Catálogo -->
<div class="overlay" id="drawer" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Menú del personaje">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-wardrobe" data-tab="wardrobe" type="button">Armario</button>
        <button class="tab" role="tab" id="tab-redeem" data-tab="redeem" type="button">Canjear</button>
        <button class="tab" role="tab" id="tab-catalog" data-tab="catalog" type="button">Catálogo</button>
      </div>
      <button class="close" id="drawerClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="panel-body" id="drawerBody" role="tabpanel"></div>
  </div>
</div>

<!-- Descargar -->
<div class="overlay" id="dlModal" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Descargar personaje">
    <div class="panel-head">
      <div class="tabs"><span class="tab" aria-selected="true" style="cursor:default">Descargar</span></div>
      <button class="close" id="dlClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="panel-body">
      <p class="sub">Los PNG miden 296 × 488 px, igual que las piezas originales. El aura es animada, así que no se incluye.</p>
      <label class="check" id="dlBgRow" hidden><input type="checkbox" id="dlBg" checked> Incluir el fondo</label>
      <div class="opts">
        <button class="opt" id="dlFull" type="button">
          <span class="ico">🧍</span>
          <div><b>Personaje completo</b><span>Un solo PNG con todas las piezas ensambladas.</span></div>
        </button>
        <button class="opt" id="dlParts" type="button">
          <span class="ico">🧩</span>
          <div><b>En piezas</b><span>Un ZIP con un PNG por pieza, todas en la misma posición.</span></div>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Visor de estampillas -->
<div class="overlay" id="viewer" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Estampilla">
    <div class="panel-head">
      <div class="tabs"><span class="tab" aria-selected="true" id="viewerTitle" style="cursor:default">Estampilla</span></div>
      <button class="close" id="viewerClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="panel-body" id="viewerBody"></div>
  </div>
</div>

<!-- Reproductor -->
<div class="pill" id="nowPlaying" hidden>
  <span aria-hidden="true">♪</span>
  <span class="pill-name" id="npName"></span>
  <button type="button" id="npToggle" aria-label="Pausar o reanudar">⏸</button>
  <button type="button" id="npStop" aria-label="Detener">✕</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = (s, r = document) => r.querySelector(s);
function toast(text){
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
function hexToRgb(hex){ const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function loadImage(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function blobToImage(blob){
  const url = URL.createObjectURL(blob);
  try { return await loadImage(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 1500); }
}

  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction("catalog", mode), s = t.objectStore("catalog");
      let out; const rq = fn(s);
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  return {
    all:   () => tx("readonly",  s => s.getAll()),
    get:   code => tx("readonly",  s => s.get(code)),
    put:   item => tx("readwrite", s => s.put(item)),
    del:   code => tx("readwrite", s => s.delete(code)),
    clear: () => tx("readwrite", s => s.clear())
  };
})();

/* Pasa lo que guardaba la versión anterior del admin (localStorage) a IndexedDB. */
async function migrateLegacy(){
  let raw = null;
  try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { return; }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    const items = Array.isArray(data.items) ? data.items : [];
    for (const it of items) {
      if (!it || !it.code || !it.img) continue;
      if (await DB.get(it.code)) continue;
      const L = LETTERS[it.letter] || LETTERS.K;
      const blob = await (await fetch(it.img)).blob();
      await DB.put({
        code: it.code, id: it.code, letter: it.letter, slot: L.slot, cat: L.cat, kind: "layer", secret: false,
        tint: !!it.tint, name: it.name, media: blob, mime: blob.type || "image/png", filename: it.code + ".png",
        stock: Number.isFinite(it.stock) ? it.stock : 1, redeemed: Number.isFinite(it.redeemed) ? it.redeemed : 0,
        createdAt: it.createdAt || Date.now()
      });
    }
    localStorage.removeItem(LEGACY_KEY);
  } catch (e) { console.error(e); }
}

/* ---------- Piezas: teñido y geometría ---------- */
function canvasFromImage(img, mode){
  const c = document.createElement("canvas");
  const x = c.getContext("2d", { willReadFrequently: true });
  if (mode === "sprite") {
    const s = Math.min(1, 256 / Math.max(img.width, img.height));
    c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
    x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  c.width = W; c.height = H;
  if (mode === "cover") {
    const s = Math.max(W / img.width, H / img.height), dw = img.width * s, dh = img.height * s;
    x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else if (img.width === W && img.height === H) {
    x.drawImage(img, 0, 0);                                   // posición y escala originales
  } else {
    const s = Math.min(W / img.width, H / img.height), dw = img.width * s, dh = img.height * s;
    x.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);     // por si llega un PNG de otro tamaño
  }
  return c;
}
function newTintable(src){
  const w = src.width, h = src.height;
  const orig = new Uint8ClampedArray(src.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data);
  const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
  const cx = canvas.getContext("2d", { willReadFrequently: true }); cx.drawImage(src, 0, 0);
  return { src, orig, canvas, cx, w, h };
}
/* Multiplica los píxeles neutros (blanco y sus grises de borde) por el color elegido.
   Con #FFFFFF queda idéntico al PNG original; el negro de las líneas no cambia
   y los píxeles con color propio (rosa y crema de la oreja) no se tocan. */
function tintInto(t, hex){
  const [r, g, b] = hexToRgb(hex);
  const out = t.cx.createImageData(t.w, t.h), o = out.data, s = t.orig, m = t.mask;   // m: zonas marcadas como pintables (opcional)
  for (let i = 0; i < s.length; i += 4) {
    const R = s[i], G = s[i + 1], B = s[i + 2];
    const mx = Math.max(R, G, B), mn = Math.min(R, G, B);
    if ((!m || m[i >> 2]) && mx - mn <= 8) { o[i] = R * r / 255; o[i + 1] = G * g / 255; o[i + 2] = B * b / 255; }
    else { o[i] = R; o[i + 1] = G; o[i + 2] = B; }
    o[i + 3] = s[i + 3];
  }
  t.cx.putImageData(out, 0, 0);
}
function applyColor(it){
  if (!it.tint) return;
  const hex = state.colors[it.slot] || "#ffffff";
  tintInto(it.main, hex);
  if (it.blink && !it.main.mask) tintInto(it.blink, hex);
}
function bboxOf(d, w, h, x0, x1){
  let ax = 1e9, ay = 1e9, bx = -1, by = -1;
  for (let y = 0; y < h; y++) for (let x = x0; x < x1; x++) {
    if (d[(y * w + x) * 4 + 3] > 0) { if (x < ax) ax = x; if (x > bx) bx = x; if (y < ay) ay = y; if (y > by) by = y; }
  }
  return bx < 0 ? null : { x: ax, y: ay, w: bx - ax + 1, h: by - ay + 1 };
}
function nearest(b, px, py){ return [Math.min(Math.max(px, b.x), b.x + b.w), Math.min(Math.max(py, b.y), b.y + b.h)]; }

function mk(meta, src, blinkSrc){
  const it = Object.assign({}, meta);
  it.main = newTintable(src);
  it.blink = blinkSrc ? newTintable(blinkSrc) : null;
  const { orig, w, h } = it.main;
  if (it.kind === "layer") {
    it.bbox = bboxOf(orig, w, h, 0, w);
    if (it.slot === "cola" && it.bbox) it.pivot = nearest(it.bbox, AXIS_X, 395);          // nace en el trasero
    if (it.slot === "alas") {                                                                // dos mitades, cada una gira desde la espalda
      it.halves = { L: bboxOf(orig, w, h, 0, AXIS_X), R: bboxOf(orig, w, h, AXIS_X, w) };
      it.pivots = {};
      ["L", "R"].forEach(k => { if (it.halves[k]) it.pivots[k] = nearest(it.halves[k], AXIS_X, 330); });
    }
  }
  return it;
}
function slotItem(slot){
  if (state.emotion && (slot === "ojos" || slot === "boca")) { const e = emoItem(state.emotion, slot); if (e) return e; }   // la emoción reemplaza ojos/boca
  if (BASE.some(b => b.slot === slot)) return runtime.get("base_" + slot);
  const id = state.equipped[slot];
  return id ? runtime.get(id) || null : null;
}
const ownedId = it => it.builtin || state.owned.has(it.pack || it.id);

async function buildFromRecord(r){
  const img = await blobToImage(r.media);
  const meta = { id: r.code, name: r.name, cat: r.cat, slot: r.slot, kind: r.kind, tint: !!r.tint && r.kind !== "bg", builtin: false };
  if (r.kind === "aura") {
    meta.aura = Object.assign({ mode: "rise", count: 24, size: 16, layer: "front" }, r.aura || {});
    return mk(meta, canvasFromImage(img, "sprite"));
  }
  if (r.kind === "bg") return mk(meta, canvasFromImage(img, "cover"));
  const blink = r.blink ? canvasFromImage(await blobToImage(r.blink), "layer") : null;
  const item = mk(meta, canvasFromImage(img, "layer"), blink);
  if (r.mask) {                                   // solo se pintan las zonas que el artista marcó
    const d = canvasFromImage(await blobToImage(r.mask), "layer").getContext("2d").getImageData(0, 0, W, H).data;
    const m = new Uint8Array(W * H);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    item.main.mask = m;
  }
  return item;
}
async function loadCatalog(){
  try { await migrateLegacy(); catalogRecs = (await DB.all()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
  catch (e) { console.warn("Sin catálogo del admin:", e); catalogRecs = []; return; }
  for (const r of catalogRecs) {
    if (r.kind === "stamp" || r.kind === "music") continue;
    if (r.kind === "emotion") {
      if (emoDone.has(r.code)) continue;
      try {
        for (let i = 0; i < (r.parts || []).length; i++) {
          const id = r.code + ":" + i;
          const it = await buildFromRecord(Object.assign({}, r.parts[i], { code: id }));
          it.pack = r.code; it.emotion = r.parts[i].emotion; runtime.set(id, it); emoItems.push(it);
        }
        emoDone.add(r.code);
      } catch (e) { console.error("No se pudo leer la emoción", r.code, e); }
      continue;
    }
    if (r.kind === "pack") {
      if (packs.has(r.code)) continue;
      try {
        const items = [];
        for (let i = 0; i < (r.parts || []).length; i++) {
          const id = r.code + ":" + i;
          const it = await buildFromRecord(Object.assign({}, r.parts[i], { code: id }));
          it.pack = r.code; items.push(it); runtime.set(id, it);
        }
        packs.set(r.code, { rec: r, items });
      } catch (e) { console.error("No se pudo leer el disfraz", r.code, e); }
      continue;
    }
    if (runtime.has(r.code)) continue;
    try { runtime.set(r.code, await buildFromRecord(r)); } catch (e) { console.error("No se pudo leer", r.code, e); }
  }
}

    }
    for (const k in s.colors || {}) if (k in state.colors && /^#[0-9a-f]{6}$/i.test(s.colors[k])) state.colors[k] = s.colors[k];
    state.owned = new Set((s.owned || []).filter(c => typeof c === "string"));
    state.equipped = {};
    for (const slot in (s.equipped || {})) {

    }
    state.emotion = (s.emotion && EMO[s.emotion] && (emoItem(s.emotion, "ojos") || emoItem(s.emotion, "boca"))) ? s.emotion : null;
  } catch (e) {}
}

/* ---------- Animación: respiración, parpadeo, alas, cola ---------- */
const BREATH_PERIOD = 4.2, BREATH_AMOUNT = 0.024;
const BLINK_MS = 140;
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const breath = t => (1 - Math.cos(2 * Math.PI * t / BREATH_PERIOD)) / 2;

let blinkStart = -1e9, nextBlink = 2200;
function blinkAmount(ms){
  if (ms >= nextBlink) {
    blinkStart = ms;
    nextBlink = Math.random() < 0.2 ? ms + 320 : ms + 2500 + Math.random() * 3000;   // a veces, doble parpadeo
  }
  const p = (ms - blinkStart) / BLINK_MS;
  return p >= 0 && p < 1 ? Math.sin(Math.PI * p) : 0;
}

/* Aura: partículas */
const aura = { id: null, parts: [] };
function auraInit(it){
  aura.id = it.id; aura.parts = [];
  for (let i = 0; i < it.aura.count; i++) aura.parts.push({ u: Math.random(), v: Math.random(), s: 0.6 + Math.random() * 0.8, ph: Math.random() * 6.283, sp: 0.6 + Math.random() * 0.8 });
}
function drawAura(ctx, t, pass){
  const it = slotItem("aura"); if (!it) return;
  if (aura.id !== it.id) auraInit(it);
  const { mode, size, layer } = it.aura, sprite = it.main.canvas, aw = sprite.width, ah = sprite.height;
  const k = size / Math.max(aw, ah);
  for (const p of aura.parts) {
    let x, y, alpha = 1, sc = p.s, rot = 0, front = layer === "front";
    if (mode === "fall") {
      const life = ((t * p.sp / (6 + p.s * 3)) + p.u) % 1;
      x = 10 + p.v * 276 + Math.sin(p.ph + t * 1.1) * 18; y = -20 + life * (H + 40); rot = t * p.sp + p.ph;
    } else if (mode === "orbit") {
      const ang = p.ph + t * p.sp * 0.6, sn = Math.sin(ang);
      x = AXIS_X + Math.cos(ang) * (95 + p.v * 25); y = 330 + sn * 38 + (p.u - 0.5) * 220;
      front = sn > 0; sc = (0.75 + 0.25 * sn) * p.s;
    } else if (mode === "twinkle") {
      const a = 0.5 + 0.5 * Math.sin(t * p.sp * 2 + p.ph);
      x = 24 + p.v * 248; y = 30 + p.u * 430; alpha = a * a; sc = 0.5 + 0.5 * p.s;
    } else {                                       // rise
      const life = ((t * p.sp / (4 + p.s * 2)) + p.u) % 1;
      x = 30 + p.v * 236 + Math.sin(p.ph + t * 1.4) * 10; y = 470 - life * (300 + p.s * 80); alpha = Math.sin(Math.PI * life);
    }
    if ((pass === "front") !== front || alpha <= 0.01) continue;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc * k, sc * k);
    ctx.drawImage(sprite, -aw / 2, -ah / 2); ctx.restore();
  }
}

/* o = { t, animated, blink, bg, aura } */
function paint(ctx, o){
  ctx.clearRect(0, 0, W, H);
  const t = o.t, an = o.animated;
  const b = an ? breath(t) : 0, bl = an ? breath(t - 0.2) : 0;
  const sy = 1 + BREATH_AMOUNT * b, sx = 1 + BREATH_AMOUNT * 0.3 * b;
  const rise = (FEET_Y - NECK_Y) * BREATH_AMOUNT, dyHead = -rise * b, dyFollow = -rise * bl;
  const sway = an ? 2.2 * Math.PI / 180 * Math.sin(2 * Math.PI * t / 5.5) : 0;
  const flap = an ? (3 + 4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / 2.6))) * Math.PI / 180 : 0;

  for (const slot of DRAW) {
    if (slot === "aura_back" || slot === "aura_front") { if (o.aura) drawAura(ctx, t, slot === "aura_front" ? "front" : "back"); continue; }
    const it = slotItem(slot); if (!it) continue;
    if (slot === "fondo") { if (o.bg) ctx.drawImage(it.main.canvas, 0, 0); continue; }

    ctx.save();
    if (BODY.has(slot)) { ctx.translate(AXIS_X, FEET_Y); ctx.scale(sx, sy); ctx.translate(-AXIS_X, -FEET_Y); }
    else if (FOLLOW.has(slot)) ctx.translate(0, dyFollow);
    else ctx.translate(0, dyHead);

    if (slot === "alas") {
      ["L", "R"].forEach(k => {
        const pv = it.pivots[k]; if (!pv) return;
        ctx.save();
        ctx.beginPath(); if (k === "L") ctx.rect(0, 0, AXIS_X, H); else ctx.rect(AXIS_X, 0, W - AXIS_X, H); ctx.clip();
        ctx.translate(pv[0], pv[1]); ctx.rotate(k === "L" ? flap : -flap); ctx.translate(-pv[0], -pv[1]);
        ctx.drawImage(it.main.canvas, 0, 0); ctx.restore();
      });
      ctx.restore(); continue;
    }
    if (slot === "cola" && it.pivot) { ctx.translate(it.pivot[0], it.pivot[1]); ctx.rotate(sway); ctx.translate(-it.pivot[0], -it.pivot[1]); }

    let img = it.main.canvas;
    if (slot === "ojos" && o.blink > 0) {
      if (it.blink) img = it.blink.canvas;
      else if (it.bbox) { const cy = it.bbox.y + it.bbox.h / 2; ctx.translate(0, cy); ctx.scale(1, 1 - 0.88 * o.blink); ctx.translate(0, -cy); }
    }
    ctx.drawImage(img, 0, 0);
    ctx.restore();
  }
}
function render(){ paint($("#view").getContext("2d"), { t: 0, animated: false, blink: 0, bg: true, aura: true }); }
function refresh(){ if (reduceMotion) render(); }
function startLoop(){
  if (reduceMotion) { render(); return; }
  const ctx = $("#view").getContext("2d");
  const tick = ms => { paint(ctx, { t: ms / 1000, animated: true, blink: blinkAmount(ms), bg: true, aura: true }); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- Equipar ---------- */
function equip(it){
  state.equipped[it.slot] = it.id;
  applyColor(it);
  if (it.kind === "aura") auraInit(it);
  save(); buildColorGrid(); refresh();
}
function unequip(slot){ delete state.equipped[slot]; save(); buildColorGrid(); refresh(); }

/* Emociones: cambian los ojos y/o la boca por las PNG de esa emoción. */
const emoItem = (emo, slot) => { const l = emoItems.filter(it => it.emotion === emo && it.slot === slot && ownedId(it)); return l.length ? l[l.length - 1] : null; };
const ownedEmotions = () => Object.keys(EMO).filter(k => emoItems.some(it => it.emotion === k && ownedId(it)));
function setEmotion(emo){
  state.emotion = emo || null;
  emoItems.forEach(it => { if (it.tint) applyColor(it); });
  save(); buildColorGrid(); buildEmoBar(); refresh();
}
function buildEmoBar(){
  const bar = $("#emoBar"), own = ownedEmotions();
  if (state.emotion && !own.includes(state.emotion)) state.emotion = null;
  bar.hidden = !own.length; bar.innerHTML = "";
  if (!own.length) return;
  [null, ...own].forEach(k => {
    const on = (state.emotion || null) === k;
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (on ? " on" : "");
    b.textContent = k ? EMO[k] : "😐";
    b.setAttribute("aria-label", k ? EMO_NAME[k] : "Sin emoción"); b.setAttribute("aria-pressed", String(on));
    b.addEventListener("click", () => { setEmotion(k); if ($("#drawer").classList.contains("open") && currentTab !== "redeem") showTab(currentTab); });
    bar.appendChild(b);
  });
}

/* Disfraces: un código D#### trae varias piezas que se ponen juntas. */
const packWorn = p => p.items.length > 0 && p.items.every(it => state.equipped[it.slot] === it.id);
function equipPack(p){
  p.items.forEach(it => { state.equipped[it.slot] = it.id; applyColor(it); if (it.kind === "aura") auraInit(it); });
  save(); buildColorGrid(); refresh();
}
function unequipPack(p){
  p.items.forEach(it => { if (state.equipped[it.slot] === it.id) delete state.equipped[it.slot]; });
  save(); buildColorGrid(); refresh();
}
function toggleEquip(it){ if (state.equipped[it.slot] === it.id) unequip(it.slot); else equip(it); }

/* ---------- Colores ---------- */
function buildColorGrid(){
  const grid = $("#colorGrid"); grid.innerHTML = "";
  const all = document.createElement("label");
  all.className = "crow all";
  all.innerHTML = '<span>Todas las piezas</span><input type="color" id="colorAll" value="#ffffff" aria-label="Color para todas las piezas">';
  grid.appendChild(all);
  $("#colorAll", grid).addEventListener("input", e => {
    Object.keys(state.colors).forEach(s => { state.colors[s] = e.target.value; const it = slotItem(s); if (it) applyColor(it); });
    grid.querySelectorAll("input[data-slot]").forEach(inp => inp.value = e.target.value);
    save(); refresh(); refreshThumbs();
  });
  COLOR_ORDER.forEach(slot => {
    const it = slotItem(slot);
    if (!it || !it.tint) return;
    const row = document.createElement("label");
    row.className = "crow";
    row.innerHTML = '<span></span><input type="color" data-slot="' + slot + '">';
    row.firstChild.textContent = SLOT_LABEL[slot];
    const inp = row.lastChild;
    inp.value = state.colors[slot];
    inp.setAttribute("aria-label", "Color de " + SLOT_LABEL[slot]);
    inp.addEventListener("input", () => { state.colors[slot] = inp.value; const cur = slotItem(slot); if (cur) applyColor(cur); save(); refresh(); refreshThumbs(); });
    grid.appendChild(row);
  });
}

let currentTab = "wardrobe", tabToken = 0, tabUrls = [];
function objUrl(blob){ const u = URL.createObjectURL(blob); tabUrls.push(u); return u; }
function revokeTabUrls(){ tabUrls.forEach(u => URL.revokeObjectURL(u)); tabUrls = []; }
function refreshThumbs(){ if ($("#drawer").classList.contains("open") && currentTab !== "redeem") showTab(currentTab); }

function thumbEl(it, locked){
  const box = document.createElement("div"); box.className = "thumb" + (locked ? " locked" : "");
  const c = document.createElement("canvas"), src = it.main.canvas;
  let sx = 0, sy = 0, sw = src.width, sh = src.height;
  if (it.kind === "layer" && it.bbox) { sx = it.bbox.x; sy = it.bbox.y; sw = it.bbox.w; sh = it.bbox.h; }
  c.width = sw; c.height = sh;
  const x = c.getContext("2d");
  x.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  if (locked) { x.globalCompositeOperation = "source-in"; x.fillStyle = "#cdb8c4"; x.fillRect(0, 0, sw, sh); }   // silueta censurada
  box.appendChild(c);
  return box;
}
/* Miniatura de un disfraz: todas sus piezas juntas, recortadas al contenido. */
function packThumb(p, locked){
  const ly = p.items.filter(i => i.kind === "layer"), bg = p.items.filter(i => i.kind === "bg");
  if (!ly.length && !bg.length) return thumbEl(p.items[0], locked);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  bg.forEach(i => x.drawImage(i.main.canvas, 0, 0));
  DRAW.forEach(s => ly.filter(i => i.slot === s).forEach(i => x.drawImage(i.main.canvas, 0, 0)));
  let box = null;
  if (!bg.length) ly.forEach(i => {
    if (!i.bbox) return;
    box = box ? { x: Math.min(box.x, i.bbox.x), y: Math.min(box.y, i.bbox.y),
                  x2: Math.max(box.x2, i.bbox.x + i.bbox.w), y2: Math.max(box.y2, i.bbox.y + i.bbox.h) }
              : { x: i.bbox.x, y: i.bbox.y, x2: i.bbox.x + i.bbox.w, y2: i.bbox.y + i.bbox.h };
  });
  const sx = box ? box.x : 0, sy = box ? box.y : 0, sw = box ? box.x2 - box.x : W, sh = box ? box.y2 - box.y : H;
  const o = document.createElement("canvas"); o.width = sw; o.height = sh;
  const ox = o.getContext("2d"); ox.drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
  if (locked) { ox.globalCompositeOperation = "source-in"; ox.fillStyle = "#cdb8c4"; ox.fillRect(0, 0, sw, sh); }
  const holder = document.createElement("div"); holder.className = "thumb" + (locked ? " locked" : ""); holder.appendChild(o);
  return holder;
}
function groupedItems(list){
  const out = [];
  CAT_ORDER.forEach(slot => { const g = list.filter(i => i.slot === slot); if (g.length) out.push([slot, g]); });
  return out;
}

async function redeem(raw){
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!/^[A-Z]\d{4}$/.test(code)) return { ok: false, msg: "Escribe la clave completa (por ejemplo K1234)." };
  let rec;
  try { await migrateLegacy(); rec = await DB.get(code); } catch (e) { return { ok: false, msg: "No se pudo leer el catálogo en este navegador." }; }
  if (!rec) return { ok: false, msg: "Esa clave no es válida." };
  if (state.owned.has(code)) return { ok: false, msg: "Ya canjeaste esta clave en este dispositivo." };
  if ((Number.isFinite(rec.stock) ? rec.stock : 1) - (rec.redeemed || 0) <= 0) return { ok: false, msg: "Esa clave ya no tiene unidades disponibles." };
  rec.redeemed = (rec.redeemed || 0) + 1;
  await DB.put(rec);
  state.owned.add(code); save();
  await loadCatalog();
  if (rec.kind === "emotion") {
    buildEmoBar();
    const ks = [...new Set((rec.parts || []).map(p => p.emotion))];
    return { ok: true, msg: "¡Conseguiste " + (ks.length > 1 ? "las emociones " : "la emoción ") + ks.map(k => EMO[k] || "").join(" ") + "! Ya aparecen bajo tu personaje.", emotion: ks[0] };
  }
  if (rec.kind === "pack") {
    const p = packs.get(code);
    return { ok: true, msg: "¡Conseguiste el disfraz " + rec.name + "! Trae " + (p ? p.items.length : 0) + " piezas y ya está en tu armario.", pack: p };
  }
  if (rec.kind === "stamp") { downloadRecord(rec); return { ok: true, msg: "¡Nueva estampilla: " + rec.name + "! Se descargó y quedó en tu galería (Armario)." }; }
  if (rec.kind === "music")  { downloadRecord(rec); return { ok: true, msg: "¡Nuevo disco: " + rec.name + "! Se descargó y puedes oírlo desde tu Armario." }; }
  return { ok: true, msg: "¡Conseguiste " + rec.name + "! Ya está en tu armario.", item: runtime.get(code) };
}

/* ---------- Descargas ---------- */
const EXT = { "image/png":"png", "image/jpeg":"jpg", "image/gif":"gif", "image/webp":"webp", "video/mp4":"mp4", "video/webm":"webm",
  "video/quicktime":"mov", "audio/mpeg":"mp3", "audio/wav":"wav", "audio/x-wav":"wav", "audio/ogg":"ogg", "audio/mp4":"m4a", "audio/aac":"aac", "audio/flac":"flac" };
function fileNameFor(r){
  let ext = (r.filename && r.filename.includes(".")) ? r.filename.split(".").pop().toLowerCase() : (EXT[r.mime] || "bin");
  const base = (r.name || r.code).replace(/[^\p{L}\p{N}_ -]+/gu, "").trim().replace(/\s+/g, "-") || r.code;
  return base + "." + ext.replace(/[^a-z0-9]/g, "");
}
function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function downloadRecord(r){ saveBlob(r.media, fileNameFor(r)); }
function canvasToBlob(c){ return new Promise(res => c.toBlob(res, "image/png")); }

function openViewer(r){

  openOverlay("#viewer");
}

/* ZIP mínimo (sin compresión) */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 33, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 33, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((n, p) => n + (p.byteLength !== undefined ? p.byteLength : p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}

$("#dlParts").addEventListener("click", async () => {

    n++;
    const blob = await canvasToBlob(it.main.canvas);
    files.push({ name: String(n).padStart(2, "0") + "_" + slot + ".png", data: new Uint8Array(await blob.arrayBuffer()) });
  }
  saveBlob(makeZip(files), "mi-personaje-piezas.zip");
  closeOverlay("#dlModal"); toast("Piezas descargadas");
});

/* ---------- Reproductor de música ---------- */
const player = new Audio();
let playingRec = null;
const isPlaying = code => !!playingRec && playingRec.code === code && !player.paused;
function syncPlayerUI(){
  const pill = $("#nowPlaying");
  pill.hidden = !playingRec;
  if (playingRec) { $("#npName").textContent = playingRec.name; $("#npToggle").textContent = player.paused ? "▶" : "⏸"; }
  document.querySelectorAll("[data-code]").forEach(d => {
    const on = isPlaying(d.dataset.code);
    d.querySelector(".vinyl").classList.toggle("spin", on);
    d.querySelector(".play").textContent = on ? "⏸ Pausar" : "▶ Oír";
  });
}
function togglePlay(r){
  if (playingRec && playingRec.code === r.code) { if (player.paused) player.play(); else player.pause(); return; }
  if (player.src) URL.revokeObjectURL(player.src);
  player.src = URL.createObjectURL(r.media); playingRec = r;
  player.play().catch(() => toast("No se pudo reproducir este audio"));
  syncPlayerUI();
}
["play", "pause"].forEach(ev => player.addEventListener(ev, syncPlayerUI));
player.addEventListener("ended", () => { playingRec = null; syncPlayerUI(); });
$("#npToggle").addEventListener("click", () => { if (player.paused) player.play(); else player.pause(); });
$("#npStop").addEventListener("click", () => { player.pause(); playingRec = null; syncPlayerUI(); });

/* ---------- Inicio ---------- */
async function init(){
  const imgs = await Promise.all(IMGS.map(loadImage));
  const layer = id => canvasFromImage(imgs[id], "layer");
  BASE.forEach(b => runtime.set("base_" + b.slot, mk({ id: "base_" + b.slot, name: SLOT_LABEL[b.slot], cat: SLOT_LABEL[b.slot], slot: b.slot, kind: "layer", tint: true, builtin: true, base: true }, layer(b.layer))));
  BUILTIN.forEach(b => runtime.set(b.id, mk({ id: b.id, name: b.name, cat: SLOT_LABEL[b.slot], slot: b.slot, kind: "layer", tint: b.tint, builtin: true }, layer(b.layer), b.blink != null ? layer(b.blink) : null)));
  await loadCatalog();
  restore();
  runtime.forEach(it => { if (it.tint) applyColor(it); });
  buildColorGrid();
  buildEmoBar();
  startLoop();
}
init().catch(err => { console.error(err); toast("No se pudieron cargar las piezas"); });
</script>
